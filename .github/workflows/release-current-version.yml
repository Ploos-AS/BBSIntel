name: Release current VERSION

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/release-current-version.yml'

permissions:
  contents: write
  actions: write

jobs:
  tag-and-dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate current version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"
          tag="v${version}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create annotated release tag
        if: steps.version.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "BBSIntel $TAG"
          git push origin "$TAG"
      - name: Dispatch release workflow on tag
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: gh workflow run release.yml --ref "$TAG"
