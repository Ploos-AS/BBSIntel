services:
  caddy:
    image: caddy:2-alpine
    depends_on:
      bbsintel-web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      BBSINTEL_DOMAIN: "${BBSINTEL_DOMAIN:-localhost}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    restart: unless-stopped

  bbsintel-web:
    build: .
    command: []
    environment:
      BBSINTEL_SCHEDULER_ENABLED: "false"
      BBSINTEL_HTTP_MAX_INFLIGHT: "64"
    volumes:
      - bbsintel-data:/data
    networks:
      - edge
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  bbsintel-worker:
    build: .
    command: ["scheduler"]
    environment:
      BBSINTEL_IMPORT_INTERVAL: "24h"
      BBSINTEL_PROBE_INTERVAL: "30m"
      BBSINTEL_PROBE_CONCURRENCY: "8"
    volumes:
      - bbsintel-data:/data
    networks:
      - worker
    restart: unless-stopped

networks:
  edge:
  worker:

volumes:
  bbsintel-data:
  caddy-data:
  caddy-config:
