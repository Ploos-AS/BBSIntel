services:
  bbsintel-web:
    build: .
    command: []
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      BBSINTEL_SCHEDULER_ENABLED: "false"
      BBSINTEL_HTTP_MAX_INFLIGHT: "64"
    volumes:
      - ./data:/data
    restart: unless-stopped

  bbsintel-worker:
    build: .
    command: ["scheduler"]
    environment:
      BBSINTEL_IMPORT_INTERVAL: "24h"
      BBSINTEL_PROBE_INTERVAL: "30m"
      BBSINTEL_PROBE_CONCURRENCY: "8"
    volumes:
      - ./data:/data
    restart: unless-stopped
